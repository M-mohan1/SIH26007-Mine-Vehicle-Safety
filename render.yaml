# Render Blueprint (not deployed; review before use).
# Two services: the FastAPI API (serves CSV-derived JSON and the demo videos) and the React static site.
services:
  - type: web
    name: sih26007-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        sync: false   # set to your static site URL, e.g. https://sih26007-web.onrender.com

  - type: web
    name: sih26007-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # set to your API URL, e.g. https://sih26007-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
